# Optional NRST configuration, adapted from the adjacent drone project.
# ST-Link V2 / STM32F103 board: SWDIO, SWCLK, GND and NRST must be connected.
source [find interface/stlink.cfg]
transport select hla_swd
source [find target/stm32f1x.cfg]

# The target script sets its own speed, so override it after sourcing the file.
adapter speed 100
reset_config srst_only srst_nogate connect_assert_srst

# Hardware reset is used to establish the initial connection. In the adjacent
# drone project's board/probe setup, repeated NRST reset-halt timed out while
# software reset-halt worked. This remote board still needs hardware testing.
# Preserve the target's existing debug/watchdog setup, then select software
# reset for program/reset and Cortex-Debug after the target has been examined.
$_TARGETNAME configure -event examine-end \
    "[$_TARGETNAME cget -event examine-end]; reset_config none"
